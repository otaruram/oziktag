services:
  - type: web
    name: oziktag-backend
    env: python
    region: singapore
    buildCommand: "cd be && pip install -r requirements.txt && python -m prisma generate"
    startCommand: "cd be && bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: EXCHANGE_RATE
        sync: false
      - key: PRICE_BUFFER_PERCENT
        sync: false
      - key: NODE_BACKEND_URL
        fromService:
          type: web
          name: oziktag-node-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: oziktag-node-backend
    env: node
    region: singapore
    buildCommand: "cd be-node && npm install"
    startCommand: "cd be-node && node index.js"
    envVars:
      - key: PYTHON_BACKEND_URL
        fromService:
          type: web
          name: oziktag-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUMOPOD_API_KEY
        sync: false
      - key: WEBHOOK_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false

