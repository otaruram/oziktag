services:
  - type: web
    name: oziktag-backend
    env: python
    region: singapore
    buildCommand: "cd be && pip install -r requirements.txt && prisma generate && prisma py fetch && find /opt/render/.cache/prisma-python -name 'prisma-query-engine-*' -type f -exec cp {} . \\; && chmod +x prisma-query-engine-* 2>/dev/null; true"
    startCommand: "cd be && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
